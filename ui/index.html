<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>カードゲーム デバッグ画面</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>カードゲーム デバッグ画面 <span class="sub">(1人で両プレイヤーを操作するローカル検証用)</span></h1>
    <div id="turn-info"></div>
    <button class="btn-open-rules">ルール</button>
  </header>

  <main>
    <section class="player-area" id="area-p2">
      <h2>Player 2</h2>
      <div class="mini-stats" id="stats-p2"></div>
      <div class="board-layout">
        <div class="side-col left-col">
          <div class="zone-box shield-box">
            <div class="zone-label">シールド</div>
            <div class="zone-value shield-value" id="shield-value-p2">0</div>
          </div>
          <div class="zone-box transcend-box" id="transcend-box-p2">
            <div class="zone-label">超越</div>
            <div class="zone-value" id="transcend-value-p2">-</div>
          </div>
          <div class="zone-box clickable-zone" id="storage-zone-p2">
            <div class="zone-label">ストレージ</div>
            <div class="zone-value" id="storage-count-p2">0</div>
          </div>
        </div>
        <div class="board-row" id="board-p2"></div>
        <div class="zone-box event-zone-box" id="event-zone-p2">
          <div class="zone-label">イベント<br />ゾーン</div>
        </div>
        <div class="side-col right-stack">
          <div class="zone-box clickable-zone" id="exile-zone-p2">
            <div class="zone-label">除外</div>
            <div class="zone-value" id="exile-count-p2">0</div>
          </div>
          <div class="zone-box clickable-zone" id="graveyard-zone-p2">
            <div class="zone-label">墓地</div>
            <div class="zone-value" id="graveyard-count-p2">0</div>
          </div>
        </div>
        <div class="hand-row" id="hand-p2"></div>
        <div class="zone-box clickable-zone deck-zone-box" id="deck-zone-p2">
          <div class="zone-label">デッキ</div>
          <div class="zone-value" id="deck-count-p2">0</div>
        </div>
      </div>
    </section>

    <section class="controls">
      <button id="btn-mulligan-p1" style="display:none;">P1: マリガン確定</button>
      <button id="btn-mulligan-p2" style="display:none;">P2: マリガン確定</button>
      <button id="btn-end-turn">ターン終了</button>
      <button id="btn-confirm-keep" style="display:none;">選択を確定(未選択なら「何も残さない」)</button>
      <button id="btn-attack-face" disabled>選択中のモンスターでプレイヤーへ直接攻撃</button>
      <button id="btn-cancel-select">選択解除</button>
      <div id="selection-info"></div>
    </section>

    <section class="player-area" id="area-p1">
      <h2>Player 1</h2>
      <div class="board-layout">
        <div class="side-col left-col">
          <div class="zone-box shield-box">
            <div class="zone-label">シールド</div>
            <div class="zone-value shield-value" id="shield-value-p1">0</div>
          </div>
          <div class="zone-box transcend-box" id="transcend-box-p1">
            <div class="zone-label">超越</div>
            <div class="zone-value" id="transcend-value-p1">-</div>
          </div>
          <div class="zone-box clickable-zone" id="storage-zone-p1">
            <div class="zone-label">ストレージ</div>
            <div class="zone-value" id="storage-count-p1">0</div>
          </div>
        </div>
        <div class="board-row" id="board-p1"></div>
        <div class="zone-box event-zone-box" id="event-zone-p1">
          <div class="zone-label">イベント<br />ゾーン</div>
        </div>
        <div class="side-col right-stack">
          <div class="zone-box clickable-zone" id="exile-zone-p1">
            <div class="zone-label">除外</div>
            <div class="zone-value" id="exile-count-p1">0</div>
          </div>
          <div class="zone-box clickable-zone" id="graveyard-zone-p1">
            <div class="zone-label">墓地</div>
            <div class="zone-value" id="graveyard-count-p1">0</div>
          </div>
        </div>
        <div class="hand-row" id="hand-p1"></div>
        <div class="zone-box clickable-zone deck-zone-box" id="deck-zone-p1">
          <div class="zone-label">デッキ</div>
          <div class="zone-value" id="deck-count-p1">0</div>
        </div>
      </div>
      <div class="mini-stats" id="stats-p1"></div>
    </section>
  </main>

  <aside id="log-panel">
    <h3>ログ</h3>
    <div id="log-content"></div>
  </aside>

  <div id="zone-modal-overlay" style="display:none;">
    <div id="zone-modal">
      <div id="zone-modal-header">
        <span id="zone-modal-title"></span>
        <button id="zone-modal-close">閉じる</button>
      </div>
      <div id="zone-modal-content"></div>
    </div>
  </div>

  <div id="picker-modal-overlay" style="display:none;">
    <div id="zone-modal">
      <div id="zone-modal-header">
        <span id="picker-modal-title"></span>
        <button id="picker-modal-cancel">キャンセル</button>
      </div>
      <div id="picker-modal-list"></div>
    </div>
  </div>

  <div id="rules-modal-overlay" style="display:none;">
    <div id="rules-modal">
      <div id="rules-modal-header">
        <button id="btn-close-rules">✕ 閉じる</button>
        <span class="rules-modal-title">ルール説明</span>
      </div>
      <div id="rules-modal-content"></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
